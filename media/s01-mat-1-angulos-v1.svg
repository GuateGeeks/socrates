<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
<title id="title">Agudo, recto y obtuso</title><desc id="description">Tres ángulos de 45, 90 y 130 grados, medidos entre un rayo horizontal hacia la derecha y otro rayo que gira hacia arriba. Cada vértice está marcado con un punto. Detrás aparece, en gris, la esquina de una hoja de 90 grados, para comparar.</desc>
<rect width="1280" height="720" fill="#ffffff"/>
<g font-family="Inter,system-ui,sans-serif" fill="#3a3a3c"><text x="64" y="90" font-family="DM Sans,Inter,system-ui,sans-serif" font-weight="500" font-size="52" letter-spacing="-1.8">Agudo, recto y obtuso</text><text x="64" y="143" font-size="25" fill="#4a4a4f">Compara la abertura con la esquina de una hoja: 90°.</text></g>
<g id="angle-45" transform="translate(64 200)" data-angle="45"><rect x="0" y="0" width="352" height="418" rx="24" fill="#ffffff" stroke="#e2e8f0"/><rect class="paper-reference" x="155" y="60" width="170" height="170" fill="#f3f4f6" stroke="#d5dbe4" stroke-width="2"/><path class="angle-rays" d="M325 230H155L275.2081528 109.7918472" fill="none" stroke="#3a3a3c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path class="angle-arc" d="M203 230A48 48 0 0 0 188.9411255 196.0588745" fill="none" stroke="#277248" stroke-width="6" stroke-linecap="round"/><circle cx="155" cy="230" r="7" fill="#3a3a3c"/><g text-anchor="middle" font-family="Inter,system-ui,sans-serif"><text x="176" y="302" font-size="46" font-weight="500" fill="#277248">45°</text><text x="176" y="350" font-family="DM Sans,Inter,system-ui,sans-serif" font-size="35" font-weight="500" fill="#277248">Agudo</text><text x="176" y="386" font-size="21" fill="#4a4a4f">Menos de 90°</text></g></g>
<g id="angle-90" transform="translate(464 200)" data-angle="90"><rect x="0" y="0" width="352" height="418" rx="24" fill="#ffffff" stroke="#e2e8f0"/><rect class="paper-reference" x="155" y="60" width="170" height="170" fill="#f3f4f6" stroke="#d5dbe4" stroke-width="2"/><path class="angle-rays" d="M325 230H155V60" fill="none" stroke="#3a3a3c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path class="right-square" d="M181 230V204H155" fill="none" stroke="#2b86c5" stroke-width="5"/><circle cx="155" cy="230" r="7" fill="#3a3a3c"/><g text-anchor="middle" font-family="Inter,system-ui,sans-serif"><text x="176" y="302" font-size="46" font-weight="500" fill="#2b86c5">90°</text><text x="176" y="350" font-family="DM Sans,Inter,system-ui,sans-serif" font-size="35" font-weight="500" fill="#2b86c5">Recto</text><text x="176" y="386" font-size="21" fill="#4a4a4f">Exactamente 90°</text></g></g>
<g id="angle-130" transform="translate(864 200)" data-angle="130"><rect x="0" y="0" width="352" height="418" rx="24" fill="#ffffff" stroke="#e2e8f0"/><rect class="paper-reference" x="155" y="60" width="170" height="170" fill="#f3f4f6" stroke="#d5dbe4" stroke-width="2"/><path class="angle-rays" d="M325 230H155L45.7261064 99.7724447" fill="none" stroke="#3a3a3c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path class="angle-arc" d="M203 230A48 48 0 0 0 124.1461947 193.2298667" fill="none" stroke="#e8782a" stroke-width="6" stroke-linecap="round"/><circle cx="155" cy="230" r="7" fill="#3a3a3c"/><g text-anchor="middle" font-family="Inter,system-ui,sans-serif"><text x="176" y="302" font-size="46" font-weight="500" fill="#a34825">130°</text><text x="176" y="350" font-family="DM Sans,Inter,system-ui,sans-serif" font-size="35" font-weight="500" fill="#a34825">Obtuso</text><text x="176" y="386" font-size="21" fill="#4a4a4f">Más de 90° y menos de 180°</text></g></g>
<g font-family="Inter,system-ui,sans-serif" font-size="22" fill="#636366"><rect x="64" y="657" width="20" height="20" rx="3" fill="#f3f4f6" stroke="#d5dbe4"/><text x="98" y="674">La hoja gris sirve como referencia. El punto marca el vértice.</text></g>
</svg>

